<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coffee House - Cart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f8f1e7;
            color: #3e2723;
        }

        /* Header */
        header {
            background-color: #4b2e24;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
        }

        nav a:hover {
            color: #f5c27a;
        }

        /* Main Container */
        .cart-container {
            width: 90%;
            max-width: 1000px;
            margin: 45px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 38px;
        }

        /* Cart Box */
        .cart-box {
            background-color: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        /* Cart Item */
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border-bottom: 1px solid #ddd;
            padding: 20px 0;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            margin-bottom: 7px;
        }

        .item-info p {
            color: #777;
        }

        /* Quantity */
        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 32px;
            height: 32px;
            border: none;
            background-color: #6f4e37;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }

        .quantity button:hover {
            background-color: #4b2e24;
        }

        .quantity span {
            min-width: 25px;
            text-align: center;
            font-weight: bold;
        }

        /* Price */
        .price {
            width: 90px;
            text-align: right;
            font-weight: bold;
        }

        /* Remove Button */
        .remove {
            background-color: #b23b3b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove:hover {
            background-color: #8d2929;
        }

        /* Summary */
        .summary {
            margin-top: 25px;
            text-align: right;
        }

        .summary p {
            font-size: 18px;
            margin: 10px 0;
        }

        .total {
            font-size: 25px !important;
            font-weight: bold;
        }

        /* Buttons */
        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 16px;
        }

        .menu-btn {
            background-color: #ddd;
            color: #3e2723;
        }

        .checkout-btn {
            background-color: #6f4e37;
            color: white;
        }

        .checkout-btn:hover {
            background-color: #4b2e24;
        }

        /* Empty Cart */
        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
            font-size: 18px;
        }

        /* Mobile */
        @media (max-width: 650px) {

            .cart-item {
                flex-wrap: wrap;
            }

            .price {
                width: auto;
            }

            nav a {
                margin-left: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>

        <div class="logo">
            ☕ Coffee House
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a href="cart.html">Cart</a>
        </nav>

    </header>


    <!-- Cart Section -->
    <div class="cart-container">

        <h1>🛒 Your Coffee Cart</h1>

        <div class="cart-box">

            <!-- Cart Items will appear here -->
            <div id="cartItems"></div>


            <!-- Order Summary -->
            <div class="summary">

                <p>
                    Subtotal:
                    ₹<span id="subtotal">0</span>
                </p>

                <p>
                    Tax (5%):
                    ₹<span id="tax">0</span>
                </p>

                <p class="total">
                    Total:
                    ₹<span id="total">0</span>
                </p>


                <div class="buttons">

                    <a href="menu.html" class="btn menu-btn">
                        ← Continue Shopping
                    </a>

                    <a href="order.html"
                       class="btn checkout-btn"
                       onclick="return checkout()">
                        Checkout →
                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script>

        /*
            Temporary cart data.

            Later we will connect this with
            menu.html using JavaScript/localStorage
            and then PHP + MySQL.
        */

        let cart = [

            {
                id: 1,
                name: "Cappuccino",
                price: 149,
                quantity: 1
            },

            {
                id: 2,
                name: "Cold Coffee",
                price: 129,
                quantity: 2
            },

            {
                id: 3,
                name: "Chocolate Cake",
                price: 99,
                quantity: 1
            }

        ];


        /* Display Cart */

        function displayCart() {

            const cartItems =
                document.getElementById("cartItems");


            /* Check empty cart */

            if (cart.length === 0) {

                cartItems.innerHTML = `
                    <div class="empty">

                        Your cart is empty ☕
                        <br><br>

                        <a href="menu.html">
                            Go to Menu
                        </a>

                    </div>
                `;

                updateSummary();

                return;
            }


            cartItems.innerHTML = "";


            /* Display every product */

            cart.forEach((item, index) => {

                const itemTotal =
                    item.price * item.quantity;


                cartItems.innerHTML += `

                    <div class="cart-item">

                        <div class="item-info">

                            <h3>
                                ${item.name}
                            </h3>

                            <p>
                                ₹${item.price} per item
                            </p>

                        </div>


                        <div class="quantity">

                            <button
                                onclick="decreaseQuantity(${index})">
                                −
                            </button>

                            <span>
                                ${item.quantity}
                            </span>

                            <button
                                onclick="increaseQuantity(${index})">
                                +
                            </button>

                        </div>


                        <div class="price">

                            ₹${itemTotal}

                        </div>


                        <button
                            class="remove"
                            onclick="removeItem(${index})">

                            Remove

                        </button>

                    </div>

                `;

            });


            updateSummary();

        }


        /* Increase Quantity */

        function increaseQuantity(index) {

            cart[index].quantity++;

            displayCart();

        }


        /* Decrease Quantity */

        function decreaseQuantity(index) {

            if (cart[index].quantity > 1) {

                cart[index].quantity--;

            }

            else {

                cart.splice(index, 1);

            }

            displayCart();

        }


        /* Remove Product */

        function removeItem(index) {

            cart.splice(index, 1);

            displayCart();

        }


        /* Calculate Total */

        function updateSummary() {

            let subtotal = 0;


            cart.forEach(item => {

                subtotal +=
                    item.price * item.quantity;

            });


            /* 5% Tax */

            const tax = subtotal * 0.05;


            const total =
                subtotal + tax;


            document.getElementById("subtotal")
                .innerText =
                subtotal.toFixed(2);


            document.getElementById("tax")
                .innerText =
                tax.toFixed(2);


            document.getElementById("total")
                .innerText =
                total.toFixed(2);

        }


        /* Checkout */

        function checkout() {

            if (cart.length === 0) {

                alert(
                    "Your cart is empty. Please add some coffee first! ☕"
                );

                return false;

            }

            return true;

        }


        /* Load Cart */

        displayCart();

    </script>

</body>

</html>
